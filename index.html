<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Veloura — a fashion & accessories e-commerce site built with vanilla JavaScript. Browse, filter, and shop with a cart and wishlist, powered by real API data." />
    <meta property="og:title" content="Veloura" />
    <meta property="og:description" content="A fashion & accessories e-commerce site built with vanilla JavaScript." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://veloura-ecommerce.netlify.app" />

<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <title> Veloura</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
       
        <nav>

            <a href="#home" class="logo">Veloura</a>

           <button
                id="hamburger-btn"
                class="hamburger"
                aria-expanded="false"
                aria-controls="nav-links"
                aria-label="Toggle menu"
            >
                ☰
            </button>

            <div id="nav-links" class="nav-links">

                <div class="nav-pages">
                    <a href="#home">Home</a>
                    <a href="#shop">Shop</a>
                </div>

                <div class="nav-actions">
                    <button id="cart-button">
                        🛒 <span id="cart-count">0</span>
                    </button>

                    <button id="wishlist-button">
                        ♥ <span id="wishlist-count">0</span>
                    </button>
                </div>

            </div>

        </nav>
    
    </header>

    <main>
        <!-- Hero -->
        <section id="home">
            <h1>Discover Your Style</h1>
            <p> Timeless fashion for every occasion.</p>
            <button>Shop Now </button>
        </section>

        <!-- Products -->
        <section id="shop">
            <h2>Featured Products</h2>
            <div class="product-controls">
            <div class="search-box">
                <input
                type="search"
                id="search-input"
                placeholder="Search products..."
                >
            </div>
            
            <div class="filters">
                <button data-category="all" class="active">All</button>
                <button data-category="Bags">Bags</button>
                <button data-category="Clothing">Clothing</button>
                <button data-category="Jewelry">Jewelry</button>
                <button data-category="Shoes">Shoes</button>
            </div>

        
        <label for="sort-select" class="sr-only">Sort products</label>    
        <select id="sort-select">
            <option value="default">Sort by</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name-az">Name: A to Z</option>
            <option value="name-za">Name: Z to A</option>
        </select>

        </div>
            
            <div id="product-grid"></div>

        </section>

    </main>

    <div id="cart-overlay"></div>

    <aside id="cart-drawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button id="close-cart">✕</button>
        </div>

        <div id="cart-items"></div>

        <div class="cart-footer">
            <p>Total: <span id="cart-total">৳ 0</span></p>
        </div>
    </aside>

    <div id="wishlist-overlay"></div>

    <aside id="wishlist-drawer">
        <div class="cart-header">
            <h2>Your Wishlist</h2>
            <button id="close-wishlist">✕</button>
        </div>
        <div id="wishlist-items"></div>
    </aside>

    <footer>
        <p>&copy; 2026 Veloura. All rights reserved.</p>
    </footer>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
